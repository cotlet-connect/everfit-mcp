[project]
name = "everfit-mcp"
version = "1.1.0"
description = "Unofficial Everfit API integration and MCP server by Cotlet: coach jobs and your own Custom API."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["everfit", "everfit api", "everfit mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/everfit-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=everfit"
Source = "https://github.com/cotlet-connect/everfit-mcp"

[project.scripts]
everfit-mcp = "everfit_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"everfit_agent.py" = "everfit_agent.py"

[tool.hatch.build.targets.sdist]
include = ["everfit_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
